name: Deploy Website to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ci-node-rsync:22

    steps:
      - name: Checkout code
        uses: https://${{ secrets.ACTION_USER }}:${{ secrets.ACTION_PASS }}@github.fdcity.cn/actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup SSH agent
        uses: https://${{ secrets.ACTION_USER }}:${{ secrets.ACTION_PASS }}@github.fdcity.cn/actions/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # vinext 构建产物：dist/client 为静态资源；dist/server 与 dist/.openai 仅用于 OpenAI/Cloudflare 托管，不部署到 Nginx
      - name: Deploy dist to server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            dist/client/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/sugar_studio/dist/"
