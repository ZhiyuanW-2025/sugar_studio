name: Deploy Website to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Prepare deployment directory
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p /var/www/sugar_studio"

      # 只同步源码。NEXT_PUBLIC_* 必须在有 .env.local 的机器上打包，CI 里打的 client 不能用。
      # 不要 --delete 项目根目录；只排除运行时文件，避免覆盖 .env.local / node_modules。
      - name: Deploy source to server
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.env.local' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.wrangler/' \
            --exclude '.vinext/' \
            -e ssh \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/sugar_studio/"

      - name: Build and reload application
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash << EOF
            set -e
            export NVM_DIR="\$HOME/.nvm"
            [ -s "\$NVM_DIR/nvm.sh" ] && \. "\$NVM_DIR/nvm.sh"
            nvm use 22

            cd /var/www/sugar_studio
            npm ci
            npm run build

            if pm2 describe sugar-studio >/dev/null 2>&1; then
              pm2 reload sugar-studio
            else
              PORT=1428 VINEXT_TRUST_PROXY=1 VINEXT_TRUSTED_HOSTS=agent.fdcity.cn \
                pm2 start "\$(command -v npm)" \
                --name sugar-studio \
                --cwd /var/www/sugar_studio \
                --interpreter "\$(command -v node)" \
                -- start
              pm2 save
            fi

            # Keep production diagnosis inside the private CI log. The app's
            # Agent error logger is deliberately sanitized and never includes
            # API keys, request headers, Vault values or model secrets.
            pm2 logs sugar-studio --err --lines 160 --nostream || true
          EOF
